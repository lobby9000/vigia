# Continuous integration: every push and pull request runs all test suites.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analytics-api:
    name: Analytics API (Flask)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vigia
          POSTGRES_PASSWORD: vigia
          POSTGRES_DB: vigia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigia"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vigia:vigia@localhost:5432/vigia_test
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: analytics-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  dashboard:
    name: Dashboard (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vigia
          POSTGRES_PASSWORD: vigia
          POSTGRES_DB: vigia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigia"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://vigia:vigia@localhost:5432/vigia
      DJANGO_DEBUG: "1"
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  ingest-service:
    name: Ingest service (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  detector-calibration:
    name: Detector calibration (Monte Carlo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # Fails if a change to the detector or the data model makes it miss an injected incident
      - run: python scripts/calibrate_detector.py --thresholds 4.5 --check

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x scripts/*.sh
