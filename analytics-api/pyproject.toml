[project]
name = "vigia-analytics"
version = "1.0.0"
description = "Stability analytics API for the Vigia monitoring platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a PostgreSQL server (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
