{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vigia{% endblock %} · Vigia</title>
  <link rel="stylesheet" href="{% static 'monitoring/dashboard.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'monitoring:overview' %}">VIGIA</a>
    <nav>
      <a href="{% url 'monitoring:overview' %}">Overview</a>
      {% if user.is_staff %}<a href="{% url 'admin:monitoring_incident_changelist' %}">Incidents</a>{% endif %}
    </nav>
    {% if user.is_authenticated %}
      <span class="muted">{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-button" type="submit">Log out</button></form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
